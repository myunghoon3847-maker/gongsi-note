<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f5d50">
<title>공시노트 업데이트 복구</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f2;color:#17201d;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.box{width:min(420px,calc(100% - 32px));padding:24px;border:1px solid #dfe4df;border-radius:14px;background:#fff;text-align:center;box-shadow:0 4px 18px rgba(30,45,39,.08)}h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#66716c;font-size:14px;line-height:1.6}.status{margin-top:14px;padding:10px;border-radius:9px;background:#edf1ed;color:#2f5d50;font-weight:800}
</style>
</head>
<body>
<main class="box"><h1>최신 버전으로 업데이트 중</h1><p>기존 서비스 워커와 앱 캐시만 정리합니다.<br>학습 기록은 삭제하지 않습니다.</p><div class="status" id="status">잠시만 기다려 주세요.</div></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      const appBase=new URL('./',location.href).href;
      await Promise.all(regs.filter(reg=>reg.scope.startsWith(appBase)).map(reg=>reg.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(key=>key.startsWith('gongsi-note-')).map(key=>caches.delete(key)));
    }
    status.textContent='정리 완료. 최신 화면을 여는 중입니다.';
    setTimeout(()=>location.replace(`./index.html?v=3.2.1&refresh=${Date.now()}`),450);
  }catch(error){
    status.textContent='자동 정리에 실패했습니다. 브라우저를 완전히 닫았다가 다시 열어 주세요.';
    console.error(error);
  }
})();
</script>
</body>
</html>
